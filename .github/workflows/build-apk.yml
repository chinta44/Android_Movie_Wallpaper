name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (v1.2.0 Cute Edition)
    runs-on: ubuntu-latest

    steps:
      - name: 1. ソースコードのチェックアウト
        uses: actions/checkout@v4

      - name: 2. JDK 17 のセットアップ
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Gradle 8.7 の自動セットアップ
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 4. かわいいアプリアイコンとUIリソースの自動生成・設定
        run: |
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          # AndroidX 設定
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> gradle.properties

          # wallpaper.xml の参照エラー修正
          sed -i 's/android:author="Android Movie Wallpaper"/android:author="@string\/app_name"/g' app/src/main/res/xml/wallpaper.xml || true

          # AndroidManifest.xml のアイコンをかわいい ic_launcher に切り替え
          sed -i 's/@android:drawable\/sym_def_app_icon/@drawable\/ic_launcher/g' app/src/main/AndroidManifest.xml || true

          # かわいいベクターアプリアイコン (ic_launcher.xml) を自動生成
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#FF8FA3" android:pathData="M24,8 C12,8 8,12 8,24 L8,84 C8,96 12,100 24,100 L84,100 C96,100 100,96 100,84 L100,24 C100,12 96,8 84,8 Z" />
              <path android:fillColor="#FFB3C1" android:pathData="M26,12 C16,12 12,16 12,26 L12,82 C12,92 16,96 26,96 L82,96 C92,96 96,92 96,82 L96,26 C96,16 92,12 82,12 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M32,48 L22,26 C21,24 24,22 26,23 L44,36 Z" />
              <path android:fillColor="#FF758F" android:pathData="M31,44 L25,29 L40,37 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M76,48 L86,26 C87,24 84,22 82,23 L64,36 Z" />
              <path android:fillColor="#FF758F" android:pathData="M77,44 L83,29 L68,37 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M54,34 C36,34 26,44 26,58 C26,74 38,82 54,82 C70,82 82,74 82,58 C82,44 72,34 54,34 Z" />
              <path android:strokeColor="#4A3E3D" android:strokeWidth="2.5" android:strokeLineCap="round" android:pathData="M38,54 C40,51 44,51 46,54" />
              <path android:strokeColor="#4A3E3D" android:strokeWidth="2.5" android:strokeLineCap="round" android:pathData="M62,54 C64,51 68,51 70,54" />
              <path android:fillColor="#FF4D6D" android:pathData="M52,58 L56,58 L54,61 Z" />
              <path android:strokeColor="#4A3E3D" android:strokeWidth="2" android:strokeLineCap="round" android:pathData="M50,62 C52,65 54,64 54,62 C54,64 56,65 58,62" />
              <path android:fillColor="#FFCCD5" android:pathData="M33,60 C33,57 37,57 37,60 C37,63 33,63 33,60 Z" />
              <path android:fillColor="#FFCCD5" android:pathData="M71,60 C71,57 75,57 75,60 C71,63 75,63 71,60 Z" />
              <path android:fillColor="#FF4D6D" android:pathData="M44,72 L64,72 C66,72 67,73 67,75 L67,82 C67,84 66,85 64,85 L44,85 C42,85 41,84 41,82 L41,75 C41,73 42,72 44,72 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M46,75 L49,75 L49,78 L46,78 Z M52,75 L56,75 L56,78 L52,78 Z M59,75 L62,75 L62,78 L59,78 Z" />
              <path android:fillColor="#FFE66D" android:pathData="M78,16 L80,20 L84,22 L80,24 L78,28 L76,24 L72,22 L76,20 Z" />
              <path android:fillColor="#FFE66D" android:pathData="M24,30 L25,32 L27,33 L25,34 L24,36 L23,34 L21,33 L23,32 Z" />
          </vector>
          EOF

          # かわいいカード背景
          cat << 'EOF' > app/src/main/res/drawable/bg_cute_card.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFFFFF" />
              <corners android:radius="24dp" />
              <stroke android:width="1.5dp" android:color="#FFD6E0" />
          </shape>
          EOF

          # かわいい選択ボタン背景
          cat << 'EOF' > app/src/main/res/drawable/bg_cute_btn_select.xml
          <ripple xmlns:android="http://schemas.android.com/apk/res/android" android:color="#40FFFFFF">
              <item>
                  <shape android:shape="rectangle">
                      <gradient android:angle="0" android:startColor="#FFA8BA" android:endColor="#FF758F" />
                      <corners android:radius="20dp" />
                  </shape>
              </item>
          </ripple>
          EOF

          # かわいい適用ボタン背景
          cat << 'EOF' > app/src/main/res/drawable/bg_cute_btn_apply.xml
          <ripple xmlns:android="http://schemas.android.com/apk/res/android" android:color="#40FFFFFF">
              <item>
                  <shape android:shape="rectangle">
                      <gradient android:angle="0" android:startColor="#FF4D6D" android:endColor="#C9184A" />
                      <corners android:radius="20dp" />
                  </shape>
              </item>
          </ripple>
          EOF

          # バージョンバッジ背景
          cat << 'EOF' > app/src/main/res/drawable/bg_badge_version.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFF0F3" />
              <corners android:radius="14dp" />
              <stroke android:width="1dp" android:color="#FFCCD5" />
          </shape>
          EOF

      - name: 5. Android SDK ライセンスの自動同意
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: 6. APKの自動ビルド (assembleDebug)
        run: gradle assembleDebug -Pandroid.useAndroidX=true --stacktrace

      - name: 7. 生成されたAPKファイルの検索
        id: apk_step
        run: |
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: 8. GitHub Releases への自動公開
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk_step.outputs.apk_path }}
          tag_name: "v1.2.0"
          name: "Android_Movie_Wallpaper v1.2.0 (Cute Edition 🌸)"
          body: |
            ### 🎀 Android_Movie_Wallpaper v1.2.0 (Cute Edition)
            - 🐱 キュートな3D子猫アプリアイコン搭載
            - 🌸 淡色ピンクの「大人カワイイ」設定画面UI
            - 🎬 選択中動画ファイル名表示＆ステータス
            - 🔋 0.0mW完全スリープ設計
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
